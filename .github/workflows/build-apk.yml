name: Build APK

on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk YT-Agent.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YT-Agent-apk
          path: YT-Agent.apk

      # A release gives a direct download link that works from a phone browser.
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: YT Агент — сборка ${{ github.run_number }}
          body: "Скачайте YT-Agent.apk на телефон и установите (разрешите установку из неизвестных источников)."
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: YT-Agent.apk
